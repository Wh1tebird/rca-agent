[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rca-agent"
version = "0.5.0"
description = "Controlled, interactive RCA100 investigation environment."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "fastapi>=0.115,<1",
    "langchain-core>=1.6,<2",
    "langchain-deepseek>=1.1,<2",
    "langchain-openai>=1.6,<2",
    "langgraph>=1.2,<2",
    "pydantic>=2.8,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rca_agent"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/analysis",
    "/.codex-build",
    "/.codex-finalizer",
    "/.codefree",
    "/.codefree-mem",
    "/frontend/node_modules",
    "/frontend/dist",
    "/backend/var",
    "/evaluation/unknown_holdout_manifest.json",
    "/evaluation/jvm_capability_probe_manifest.json",
    "/evaluation/jvm_diagnostic_manifest.json",
    "*.log",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "requires_rca100: tests that require the private external RCA100 observation directory",
]

[tool.ruff]
line-length = 100
target-version = "py311"
