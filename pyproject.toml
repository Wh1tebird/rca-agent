[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rca-agent"
version = "0.2.0"
description = "Controlled, interactive RCA100 investigation environment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "fastapi>=0.115,<1",
    "langchain-core>=1.6,<2",
    "langchain-deepseek>=1.1,<2",
    "langchain-openai>=1.6,<2",
    "langgraph>=1.2,<2",
    "pydantic>=2.8,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rca_agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
